[package]
name = "roboticela-todo"
version = "0.1.0"
description = "ToDo"
authors = ["Roboticela"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-android-ui = { path = "tauri-plugin-android-ui" }
tauri-plugin-reminder-service = { path = "tauri-plugin-reminder-service" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
tauri-plugin-notification = "2.3.3"
# Vendored 0.5.1 with Android SiWG fix (many Google accounts → NoCredentialException)
tauri-plugin-google-auth = { path = "vendor/tauri-plugin-google-auth" }

# Enable for local dev: cargo build --features devtools (opens devtools on startup)
[features]
default = []
devtools = ["tauri/devtools"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
